# Blueprint do Render. "New > Blueprint" apontando para este repositorio
# monta o servico inteiro: container, disco persistente e variaveis.
services:
  - type: web
    name: meus-imoveis
    runtime: docker
    # O disco persistente exige plano pago. No plano free o filesystem e
    # efemero: todo deploy e todo restart apagariam data.db — contas,
    # contratos e links junto.
    plan: starter
    region: oregon
    healthCheckPath: /
    envVars:
      # Cookie de sessao marcado como Secure.
      - key: HTTPS
        value: "1"
      # Fora de /app de proposito: /app e substituido a cada deploy.
      - key: DB_FILE
        value: /data/data.db
      # Um proxy (o balanceador do Render) na frente do app. Sem isto o IP de
      # todo usuario e o do proxy: a evidencia do aceite fica errada e o limite
      # de login por IP tranca todo mundo junto. Ver server/index.js.
      - key: TRUST_PROXY
        value: "1"
    disk:
      name: dados
      mountPath: /data
      sizeGB: 1
